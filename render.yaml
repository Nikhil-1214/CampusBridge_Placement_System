services:
  - type: web
    name: campusbridge
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: campusbridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_TYPE
        value: sqlite
      - key: DATABASE_PATH
        value: /var/data/placement.db
